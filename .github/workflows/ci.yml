name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # The real compatibility check: same tests on the Espruino interpreter (Linux build, cached).
  espruino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: .espruino
          key: espruino-linux-${{ hashFiles('scripts/espruino-test.sh') }}
      - run: npm ci   # terser: the bundle under test is minified, as on devices
      - run: npm run test:espruino
