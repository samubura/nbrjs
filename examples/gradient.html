<!doctype html>
<meta charset="utf-8">
<title>nbrjs · gradient</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #fafafa; color: #222; }
  canvas { border: 1px solid #ccc; cursor: pointer; max-width: 100%; }
</style>
<p>Click a node to make it the source. Distance is recomputed by the aggregate program every 100 ms.</p>
<canvas id="c" width="480" height="480"></canvas>
<script src="../src/core.js"></script>
<script src="../src/sim.js"></script>
<script>
  var A = nbrjs, N = 12, S = 40, pos = {}, source = '0';
  for (var i = 0; i < N * N; i++) pos[i] = [i % N + Math.random() * 0.4, Math.floor(i / N) + Math.random() * 0.4];
  var net = nbrjsSim.network(pos, 1.5);

  var gradient = function (src) {
    return A.share(Infinity, function (d) {
      return src ? 0 : d.zip(A.nbrSense('range'), function (a, b) { return a + b; }).reduce(Math.min, Infinity);
    });
  };
  var program = function () { return gradient(A.mid() === source); };

  var ctx = document.getElementById('c').getContext('2d');
  var draw = function (out) {
    ctx.clearRect(0, 0, 480, 480);
    for (var id in pos) {
      var d = out[id], x = pos[id][0] * S + S / 2, y = pos[id][1] * S + S / 2;
      ctx.fillStyle = isFinite(d) ? 'hsl(' + Math.min(d * 18, 240) + ',80%,50%)' : '#999';
      ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.fillText(isFinite(d) ? d.toFixed(1) : '∞', x - 8, y + 22);
    }
  };
  document.getElementById('c').onclick = function (e) {
    var r = e.target.getBoundingClientRect(), k = 480 / r.width, best = Infinity;
    for (var id in pos) {
      var dx = pos[id][0] * S + S / 2 - (e.clientX - r.left) * k, dy = pos[id][1] * S + S / 2 - (e.clientY - r.top) * k;
      if (dx * dx + dy * dy < best) { best = dx * dx + dy * dy; source = id; }
    }
  };
  setInterval(function () { draw(net.step(program)); }, 100);
</script>
